# ===================================================================
# SilverCare Healthcare Platform - Spring Boot Configuration
# ===================================================================

server.port=8080

# Application Name
spring.application.name=silvercare-platform

# In-Memory H2 Database (Ready out-of-the-box for instant testing)
spring.datasource.url=jdbc:h2:mem:silvercaredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

